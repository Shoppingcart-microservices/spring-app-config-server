apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server-app
  labels:
    app: config-server-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server-app
  template:
    metadata:
      name: config-server-app
      labels:
        app: config-server-app
    spec:
      containers:
        - name: config-server-app
          image: konped/config-server
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
              protocol: TCP
      restartPolicy: Always
      